aid: zeabur
url: https://raw.githubusercontent.com/api-evangelist/zeabur/refs/heads/main/apis.yml
name: Zeabur
kind: company
description: Zeabur is a deploy-anything cloud platform (PaaS) that ships applications,
  databases, and services with one click. Its public API is GraphQL-first, exposing
  projects, environments, services, deployments, environment variables, domains, regions,
  and templates through a single endpoint at https://api.zeabur.com/graphql.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- PaaS
- Deployment
- Cloud
- DevOps
- GraphQL
created: '2026-07-01'
modified: '2026-07-01'
specificationVersion: '0.19'

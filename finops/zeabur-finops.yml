description: >-
  FinOps view of Zeabur spend. Zeabur bills a flat monthly subscription
  (Developer / Team) plus usage-based platform resources: compute (vCPU-hours),
  memory (GB-hours), and network egress (bandwidth GB). Costs accrue per
  running service across projects and environments. The public GraphQL API is
  not separately metered; it is the control plane through which resources are
  provisioned, scaled, suspended, and torn down.
notes: >-
  Per-resource rates are usage-based and subject to change; verify against the
  Zeabur pricing page during reconciliation. Suspending idle services and
  right-sizing compute/memory are the primary optimization levers.

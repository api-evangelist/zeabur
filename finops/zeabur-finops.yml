meters:
- name: subscription_fee
  description: Flat monthly plan fee (Developer / Team) charged per account or team.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: compute_vcpu_hours
  description: vCPU-hours consumed by running services, billed by usage.
  unit: vcpu_hours
  aggregation: sum
  dimensions:
  - account
  - project
  - service
  - environment
- name: memory_gb_hours
  description: Memory GB-hours consumed by running services, billed by usage.
  unit: gb_hours
  aggregation: sum
  dimensions:
  - account
  - project
  - service
  - environment
- name: bandwidth_gb
  description: Network egress in GB served from deployed services.
  unit: gb
  aggregation: sum
  dimensions:
  - account
  - project
  - service
  - environment
principles:
- name: Visibility
  description: Pull Zeabur usage/billing detail; attribute compute, memory, and bandwidth spend per project, service, and environment.
- name: Allocation
  description: Organize workloads into projects and environments (production/staging) and, on Team plans, per team to map spend to owners.
- name: Optimization
  description: Suspend idle services, right-size compute/memory, consolidate low-traffic services, and reduce egress with caching/CDN in front of high-bandwidth services.
- name: Accountability
  description: Assign project/environment owners and review monthly resource burn against budget; use the GraphQL API to automate suspend/scale actions.
